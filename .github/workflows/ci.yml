name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the workflow token; no job needs to write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Core quality gate (blocking) ───────────────────────────────────────
  build-test:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # ── Edge Function checks (blocking) ────────────────────────────────────
  deno:
    name: deno check · deno test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run deno:check
      - run: npm run deno:test

  # ── Dependency audit (blocking on production deps) ─────────────────────
  audit:
    name: npm audit (prod, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only production dependencies gate the build; build-tool-only
      # advisories (braces via Tailwind 3) are tracked in SECURITY_AUDIT.md.
      - run: npm audit --omit=dev --audit-level=high

  # ── Secret scanning (blocking) ─────────────────────────────────────────
  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits to decide what to scan.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Database: migrations from scratch + RLS/privilege tests (blocking) ─
  database:
    name: migrations · security.sql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Applies every migration to a fresh supabase/postgres container, then
      # runs supabase/tests/security.sql (RLS, grants, pricing, loyalty).
      - run: npm run test:db

  # ── End-to-end purchase funnel + a11y (informational until tuned) ──────
  e2e:
    name: playwright e2e + axe a11y
    runs-on: ubuntu-latest
    # Flip continue-on-error to false once green in your environment to make
    # this a hard gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # ── Full PayFast-sandbox funnel (opt-in; needs a configured backend) ────
  e2e-payfast:
    name: e2e → PayFast sandbox
    runs-on: ubuntu-latest
    # Enable by setting repo variable RUN_PAYFAST_E2E=true and the two secrets
    # below (a Supabase project with the Edge Functions deployed + sandbox PayFast).
    if: ${{ vars.RUN_PAYFAST_E2E == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run full funnel against PayFast sandbox
        env:
          E2E_PAYFAST: "1"
          # Baked into the build by Vite (the webServer builds before serving).
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
        run: npx playwright test funnel-payfast.spec.ts --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-payfast-report
          path: playwright-report
          retention-days: 7

  # ── Lighthouse / Core Web Vitals budget (informational) ────────────────
  lighthouse:
    name: lighthouse CWV budget
    runs-on: ubuntu-latest
    needs: build-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Uses the bundled lhci (no local @lhci/cli dep) with our budget config.
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
